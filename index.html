<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PITAAAN！ 備品・発注リスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="initial-data.js"></script>
<style>
:root{
  --bg:#fffef2; --surface:#ffffff; --surface-2:#fdfde6; --ink:#3a2633; --ink-2:#7a6573; --line:#f4c3d7; --border:#e7367f;
  --pink:#e7367f; --pink-text:#c41f68; --orange:#f58a01; --brand-yellow:#e5e51c; --page-a:#fafad7; --page-b:#a1ddff; --grid:rgba(160,155,0,.10);
  --signal:#e5e51c; --signal-ink:#3a2633; --alert:#d6332c; --ok:#1d8a80; --focus:#1569b0;
  --c-fab:#e7367f; --c-craft:#f58a01; --c-elec:#3aa8e8; --c-daily:#2fbfb2; --c-gear:#b2ad00;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1720; --surface:#26202b; --surface-2:#302a36; --ink:#fbf2f7; --ink-2:#c9b8c3; --line:#6a3c55; --border:#ff6aa6;
    --pink:#ff6aa6; --pink-text:#ff85b6; --orange:#ffa133; --brand-yellow:#e5e51c; --page-a:#1e1c12; --page-b:#10303f; --grid:rgba(255,255,255,.035);
    --signal:#e5e51c; --signal-ink:#2a1d26; --alert:#ff6b66; --ok:#5fd8cc; --focus:#8cc8ff;
    --c-fab:#ff6aa6; --c-craft:#ffa133; --c-elec:#6cc2f2; --c-daily:#5fd8cc; --c-gear:#d9d43a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1720; --surface:#26202b; --surface-2:#302a36; --ink:#fbf2f7; --ink-2:#c9b8c3; --line:#6a3c55; --border:#ff6aa6;
    --pink:#ff6aa6; --pink-text:#ff85b6; --orange:#ffa133; --brand-yellow:#e5e51c; --page-a:#1e1c12; --page-b:#10303f; --grid:rgba(255,255,255,.035);
    --signal:#e5e51c; --signal-ink:#2a1d26; --alert:#ff6b66; --ok:#5fd8cc; --focus:#8cc8ff;
    --c-fab:#ff6aa6; --c-craft:#ffa133; --c-elec:#6cc2f2; --c-daily:#5fd8cc; --c-gear:#d9d43a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
.top-in{max-width:760px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;font-weight:400;font-size:1.25rem;letter-spacing:.02em;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand h1{color:var(--ink)}}
.brand small{font-size:.8rem;opacity:.75}
.tabs{display:flex;gap:4px}
.tab{flex:1;border:0;background:transparent;color:inherit;opacity:.7;padding:10px 8px 12px;font-weight:700;border-bottom:4px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--signal)}
.badge{min-width:1.6em;padding:0 .45em;border-radius:99px;background:var(--signal);color:var(--signal-ink);font-size:.8rem;line-height:1.6;font-weight:700}
.badge[hidden]{display:none}

main{max-width:760px;margin:0 auto;padding:20px 16px 120px}
.notice{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--signal);padding:12px 14px;border-radius:6px;margin-bottom:16px;color:var(--ink-2)}
.notice[hidden]{display:none}

/* order view */
.hero{display:flex;align-items:flex-end;gap:14px;margin:4px 0 18px}
.hero-num{font-family:"Mochiy Pop One",sans-serif;font-size:4.2rem;line-height:.9;letter-spacing:-.02em}
.hero-num.zero{color:var(--ok)}
.hero-txt{padding-bottom:6px}
.hero-txt strong{display:block;font-size:1.1rem}
.hero-txt span{color:var(--ink-2);font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.btn{border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:8px;font-weight:700;line-height:1.3}
.btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn.ghost{border-color:var(--line);background:transparent}
.btn.danger{border-color:var(--alert);color:var(--alert);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:.88rem;border-width:2px}

h2.sec{font-size:1rem;margin:28px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .count{color:var(--ink-2);font-weight:500;font-size:.9rem}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.order-row{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;border-left:6px solid var(--cat)}
.order-row .nm{font-weight:700}
.order-row .meta{grid-column:1;color:var(--ink-2);font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.order-row .meta a{color:var(--focus)}
.order-row .qty{font-family:"Mochiy Pop One",sans-serif;font-size:1.25rem;text-align:right}
.order-row .qty small{font-family:"Zen Maru Gothic",sans-serif;font-size:.8rem;color:var(--ink-2);margin-left:2px}
.order-row .row-actions{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.order-row .row-actions .del{margin-left:auto}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:8px;padding:22px 18px;color:var(--ink-2);text-align:center}

/* stock view */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:6px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--cat)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.cat-h{font-size:.92rem;margin:22px 0 8px;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.cat-h .dot{width:12px;height:12px;border-radius:3px;background:var(--cat)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 10px 10px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.item .nm{background:none;border:0;padding:0;text-align:left;font-weight:700;line-height:1.4}
.item .nm:hover{text-decoration:underline}
.var{display:inline-block;margin-left:6px;font-size:.8rem;font-weight:700;padding:0 .55em;border-radius:4px;border:1.5px solid var(--cat-line,var(--line));background:var(--surface-2);vertical-align:1px}
.item .sub{font-size:.8rem;color:var(--ink-2)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:0 .5em;border-radius:4px;margin-left:6px;vertical-align:2px}
.tag.need{background:var(--signal);color:var(--signal-ink)}
.tag.wait{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tag.unk{background:transparent;color:var(--ink-2);border:1px dashed var(--ink-2)}
.stepper{display:flex;align-items:center;gap:2px;grid-row:1 / span 2;grid-column:2}
.stepper button.pm{width:44px;height:44px;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);font-size:1.3rem;font-weight:700;line-height:1}
.stepper .val{min-width:56px;height:44px;border:0;background:none;font-family:"Mochiy Pop One",sans-serif;font-size:1.3rem;text-align:center;border-radius:8px}
.stepper .val.unk{font-family:"Zen Maru Gothic",sans-serif;font-size:.85rem;color:var(--ink-2);text-decoration:underline}
.gauge{grid-column:1;height:8px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden;border:1px solid var(--line)}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:99px;transition:width .2s}
.gauge.low i{background:var(--signal)}
.gauge.out i{background:var(--alert)}
.gauge b{position:absolute;top:-2px;bottom:-2px;left:50%;width:2px;background:var(--ink-2);opacity:.6}

.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;border:0;background:var(--signal);color:var(--signal-ink);font-weight:700;padding:14px 20px;border-radius:99px;box-shadow:0 3px 0 var(--ink)}
.fab[hidden]{display:none}

/* dialog */
dialog{border:0;border-radius:12px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow-y:auto;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:1.15rem}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;font-weight:700}
.field .hint{font-size:.78rem;color:var(--ink-2)}
.field input,.field select,.field textarea{padding:9px 11px;border:2px solid var(--line);border-radius:8px;background:var(--surface-2);width:100%;max-width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.dlg-actions{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.dlg-actions .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--alert);font-size:.85rem;min-height:1em}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;color:var(--focus);text-decoration:none;border:1.5px solid var(--line);border-radius:99px;padding:1px 10px;background:var(--surface-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk:hover{border-color:var(--focus)}
.order-row .links{grid-column:1 / -1}
.item .links{margin-top:4px}
textarea.copy{width:100%;min-height:200px;font-size:.9rem}

.lowbtn{grid-row:1 / span 2;grid-column:2;min-height:48px;padding:8px 14px;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:.9rem;line-height:1.3}
.lowbtn.on{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.mode-tag{font-size:.75rem;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 .4em;margin-left:6px;vertical-align:2px}
.solo{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--cat);border-radius:12px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;text-align:center}
.solo .cat{color:var(--ink-2);font-size:.88rem}
.solo h2{margin:0;font-family:"Mochiy Pop One",sans-serif;font-weight:400;font-size:1.7rem;line-height:1.3}
.solo .status{font-weight:700}
.solo .big{font-size:1.25rem;padding:20px;border-radius:12px;border:0;background:var(--signal);color:var(--signal-ink);font-weight:700;box-shadow:0 3px 0 var(--ink)}
.solo .big.done{background:var(--surface-2);color:var(--ink-2);box-shadow:none;border:2px solid var(--line)}
.solo .bigstep{display:flex;align-items:center;justify-content:center;gap:12px}
.solo .bigstep button{width:72px;height:72px;font-size:2rem;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--surface-2)}
.solo .bigstep .n{font-family:"Mochiy Pop One",sans-serif;font-size:3rem;min-width:90px}
.solo .links{justify-content:center}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.qr-label{background:#fff;color:#111;border:1.5px dashed #999;border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border-top:6px solid var(--cat)}
.qr-label svg{width:120px;height:120px}
.qr-label .n{font-weight:700;font-size:.9rem;line-height:1.3}
.qr-label .s{font-size:.72rem;color:#555}
@media print{
  .top,body::before,.fab,.no-print,.notice,.toast{display:none!important}
  :root{padding:0}
  body{background:#fff}
  main{padding:0;max-width:none}
  .qr-grid{grid-template-columns:repeat(3,1fr)}
  .qr-label{break-inside:avoid}
}
.help{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 20px 20px}
.help h2{font-family:"Mochiy Pop One",sans-serif;font-weight:400;font-size:1.3rem;margin:18px 0 6px}
.help h3{font-size:1.02rem;margin:26px 0 6px;padding-left:10px;border-left:5px solid var(--signal)}
.help p{margin:6px 0;max-width:40em}
.help ol{margin:6px 0;padding-left:1.4em;max-width:40em}
.help li{margin:4px 0}
.help .lead{color:var(--ink-2)}
.hhero svg{width:100%;max-width:520px;height:auto;display:block;margin:12px auto 0}
.hstep{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:start;padding:20px 0;border-top:1px dashed var(--line)}
.hstep:first-of-type{border-top:0}
.hill{background:var(--surface-2);border-radius:12px;padding:8px}
.hill svg{width:100%;height:auto;display:block}
.htxt h3{margin-top:4px}
@media (max-width:560px){.hstep{grid-template-columns:1fr}.hill{max-width:320px}}
.help b{font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.hero-num{font-size:3.4rem}}
/* ---- PITAAAN！ tone ---- */
body{background-color:var(--page-a);background-image:none}
body::before{background:var(--surface)}
.top{background:var(--surface);color:var(--ink);border-bottom:3px solid var(--pink)}
.top-in{padding-top:8px}
.brand{align-items:center}
.brand h1{display:flex;align-items:center;gap:10px;font-size:1rem;color:var(--ink)!important}
.brand h1 img{height:40px;width:auto;display:block}
.brand h1 span{font-family:"Mochiy Pop One",sans-serif;color:var(--pink)}
.brand small{color:var(--ink-2);opacity:1}
.tab{opacity:1;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--pink);border-bottom-color:var(--pink)}
.badge{background:var(--orange);color:#fff}
.hero{background:var(--surface);border:2.5px solid var(--pink);border-radius:20px;padding:18px 120px 18px 20px;position:relative;margin-top:24px;min-height:120px;align-items:center}
.hero-num{color:var(--pink);font-size:3.6rem}
.hero-num.zero{color:var(--ok)}
.hero-ill{position:absolute;right:10px;bottom:-6px;height:150px;width:auto;pointer-events:none}
.hero-ill.woman{height:auto;width:130px;bottom:-4px}
.order-row,.item,.notice,.help,.solo,.search{border:2px solid var(--line);border-radius:14px}
.order-row{border-left:8px solid var(--cat)}
.empty{border:2.5px dashed var(--pink);border-radius:16px}
.empty-ill{display:block;width:160px;height:auto;margin:0 auto 10px}
.notice{border-left:8px solid var(--orange)}
.btn{border-color:var(--pink);border-radius:99px;color:var(--ink)}
.btn.primary{background:var(--signal);border-color:var(--pink);color:var(--signal-ink);box-shadow:3px 3px 0 var(--pink)}
.btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pink)}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.fab{background:var(--signal);color:var(--signal-ink);border:2.5px solid var(--pink);box-shadow:4px 4px 0 var(--pink);font-family:"Mochiy Pop One",sans-serif;font-weight:400}
.chip{border-color:var(--line)}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.cat-h,h2.sec{color:var(--ink);font-family:"Mochiy Pop One",sans-serif;font-weight:400}
.cat-h{background:var(--surface);display:inline-flex;padding:3px 12px 3px 8px;border-radius:99px;border:2px solid var(--line)}
.stepper button.pm,.solo .bigstep button{border-color:var(--pink);background:var(--surface)}
.stepper .val{color:var(--pink)}
.stepper .val:not(.unk){border-bottom:2px dashed var(--line);border-radius:6px 6px 0 0}
.stepper .val.unk{font-family:"Zen Maru Gothic",sans-serif;font-size:.85rem;font-weight:700;color:var(--signal-ink);text-decoration:none;background:var(--signal);border:2px solid var(--pink);border-radius:99px;box-shadow:2px 2px 0 var(--pink);padding:0 12px;min-width:auto;white-space:nowrap;margin:0 4px}
.tag.need{background:var(--orange);color:#fff}
.gauge{border-color:var(--line)}
.gauge.low i{background:var(--orange)}
.var{border-color:var(--pink);background:var(--surface)}
.lnk{border-color:var(--line)}
dialog{border:3px solid var(--pink);border-radius:18px}
.dlg h3{font-family:"Mochiy Pop One",sans-serif;font-weight:400;color:var(--pink)}
.field input,.field select,.field textarea{border-color:var(--line)}
.solo{border:2.5px solid var(--pink);border-top:10px solid var(--cat);position:relative;padding-top:28px}
.solo-ill{width:70px;height:auto;margin:0 auto -6px;display:block}
.solo .big{background:var(--signal);color:var(--signal-ink);border:2.5px solid var(--pink);box-shadow:4px 4px 0 var(--pink)}
.help{border:2.5px solid var(--pink);border-radius:20px;overflow:hidden}
.hhero{margin:-8px -20px 0;background:#fff}
.hhero img{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
.help h2{color:var(--pink);font-size:1.45rem}
.help h3{border-left-color:var(--pink);font-family:"Mochiy Pop One",sans-serif;font-weight:400}
.hill{background:var(--surface-2);border:2px solid var(--line)}
.hstep{border-top-color:var(--line)}
.toast{background:var(--pink);color:#fff}
.qr-label{border-top-color:var(--cat)}
@media (max-width:420px){.hero{padding-right:96px}.hero-ill{height:120px}.hero-ill.woman{width:100px}.brand h1 img{height:32px}}
@media print{body{background:#fff!important}}
/* ---- usability fixes kept on the PITAAAN！ look ---- */
.badge,.tag.need{background:var(--orange);color:var(--signal-ink)}
.hero-txt span,.item .sub,.order-row .meta{color:var(--ink-2)}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{min-height:44px;padding:9px 16px;font-size:.92rem}
.btn.primary{font-size:1.02rem;padding:12px 22px}
.btn.wide{width:100%}
#v-order .actions{justify-content:center}
.order-row .row-actions{gap:10px;margin-top:6px}
.lnk{min-height:40px;padding:6px 14px}
.links{gap:8px}
.chip{min-height:40px}
.search{min-height:48px}
.field input,.field select,.field textarea{min-height:46px}
.fab{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);bottom:auto;right:max(16px,calc(50vw - 364px));z-index:7;background:var(--surface);color:var(--pink-text);border:2px solid var(--pink);box-shadow:2px 2px 0 var(--pink);min-height:44px;padding:8px 16px;font-size:.92rem;font-family:"Mochiy Pop One",sans-serif;font-weight:400}
.brand small{display:none}
.top{box-shadow:0 4px 0 var(--brand-yellow)}
.brand{min-height:48px;padding-right:160px}
.item{min-height:72px}
.cat-h{align-self:flex-start}
.stepper{gap:6px}
.stepper button.pm{width:48px;height:48px;border-radius:12px}
.stepper .val{height:48px}
.stepper .val:not(.unk){border-bottom:2px dashed var(--line);border-radius:6px 6px 0 0}
.stepper .val.unk{font-family:"Zen Maru Gothic",sans-serif;font-size:.92rem;font-weight:700;color:#fff;background:var(--pink);border:0;border-radius:99px;box-shadow:2px 2px 0 var(--ink);padding:0 20px;min-width:auto;min-height:48px;white-space:nowrap;margin:0;text-decoration:none}
.solo .big.input{background:var(--pink);color:#fff;border:0;box-shadow:3px 3px 0 var(--ink)}
.stepper button.pm:disabled,.solo .bigstep button:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:420px){.fab{padding:8px 12px;font-size:.8rem}.brand{padding-right:132px}}
/* ---- login ---- */
.login{max-width:440px;margin:24px auto;background:var(--surface);border:2.5px solid var(--pink);border-radius:20px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.login img{height:120px;width:auto}
.tabs[hidden]{display:none}
.login h2{margin:0;font-family:"Mochiy Pop One",sans-serif;font-weight:400;color:var(--pink-text);font-size:1.3rem}
.login p{margin:0;color:var(--ink-2);font-size:.92rem}
.login .err{color:var(--alert);font-weight:700}
.account{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--ink-2);font-size:.9rem}
/* ---- responsive: PC & smartphone ---- */
.tab{white-space:nowrap}
.brand h1 span{white-space:nowrap}
@media (max-width:420px){.tab{font-size:.9rem;gap:5px;padding-left:4px;padding-right:4px}.badge{font-size:.72rem}}
.item .nm{overflow-wrap:anywhere}
.btn:hover:not(:disabled),.chip:hover,.stepper button.pm:hover:not(:disabled),.lnk:hover{filter:brightness(.96)}
@media (max-width:380px){
  main{padding-left:12px;padding-right:12px}
  .stepper button.pm{width:44px;height:44px}
  .stepper .val{min-width:40px;font-size:1.15rem}
  .item{padding-left:12px}
  .brand h1 span{font-size:.78rem}
  .brand h1{gap:6px}
  .brand h1 img{height:26px}
}
@media (min-width:900px){
  .top-in,main{max-width:1120px}
  .top-in{padding-left:24px;padding-right:24px}
  main{padding:28px 24px 80px}
  .fab{right:max(24px,calc(50vw - 536px))}
  .brand h1 img{height:44px}
  .brand h1 span{font-size:1.15rem}
  .tabs{max-width:560px}
  .hero{min-height:130px}
  .btn.wide{width:auto;min-width:340px}
  #v-order .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  #v-stock .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;align-items:start}
  #v-stock .list > .cat-h,#v-stock .list > .empty{grid-column:1 / -1;justify-self:start}
  #v-stock .list > .empty{justify-self:stretch}
  .toolbar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px}
  .toolbar .search{flex:1 1 320px;width:auto}
  .toolbar .chips{flex:1 1 100%;order:3;flex-wrap:wrap;overflow:visible}
  .help{padding:8px 32px 28px}
  .hhero{margin:-8px -32px 0}
  .hstep{grid-template-columns:280px 1fr;gap:28px}
  #v-item,#v-qr .no-print{max-width:640px;margin-left:auto;margin-right:auto}
  .qr-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
}
@media (min-width:1280px){
  #v-order .list{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog">
    <h3 id="dlg-title">備品を登録</h3>
    <div class="field"><label for="f-name">品名</label><input id="f-name" required maxlength="60" placeholder="例：MDF板 3mm"></div>
    <div class="field"><label for="f-var">色・種類</label><input id="f-var" maxlength="30" placeholder="例：白、黒、透明"><span class="hint">色ごとに在庫・リンク・発注を分けたいときに入力します。同じ品名で色違いを登録すると並んで表示されます</span></div>
    <div class="field"><label for="f-links">商品リンク</label><textarea id="f-links" rows="2" maxlength="3000" placeholder="https://… （1行に1つ。複数登録できます）"></textarea><span class="hint">いつも買っている商品ページのURLを貼り付けてください</span></div>
    <div class="grid2">
      <div class="field"><label for="f-cat">ジャンル</label><select id="f-cat"></select></div>
      <div class="field"><label for="f-unit">単位</label><input id="f-unit" maxlength="10" placeholder="枚・本・個"></div>
    </div>
    <div class="grid3">
      <div class="field count-only"><label for="f-stock">いまの在庫</label><input id="f-stock" type="number" min="0" inputmode="numeric" placeholder="未確認"></div>
      <div class="field count-only"><label for="f-min">最低在庫</label><input id="f-min" type="number" min="0" inputmode="numeric"></div>
      <div class="field"><label for="f-qty">1回の発注数</label><input id="f-qty" type="number" min="1" inputmode="numeric" required></div>
    </div>
    <p class="field hint count-only" style="margin:0">在庫が「最低在庫」を下回ると、発注リストに自動で載ります。最低在庫と同じ数なら、まだ載りません。</p>
    <div class="field"><label for="f-shop">購入先</label><input id="f-shop" maxlength="200" placeholder="例：Amazon、モノタロウ、ホームセンター"></div>
    <div class="field"><label for="f-note">メモ</label><input id="f-note" maxlength="200" placeholder="型番・色・サイズなど"></div>
    <div class="field"><label for="f-last">最終発注日</label><input id="f-last" type="date"><span class="hint">「発注した」を押すと自動で更新されます。過去の発注日を入れておくこともできます</span></div>
    <div class="err" id="f-err"></div>
    <div class="dlg-actions">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn danger sm" id="f-del" hidden>削除</button><button type="button" class="btn sm" id="f-dup" hidden>＋ 色違いを登録</button></div>
      <div class="right">
        <button type="button" class="btn ghost" id="f-cancel">閉じる</button>
        <button type="submit" class="btn primary" id="f-save">保存</button>
      </div>
    </div>
  </form>
</dialog>

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isUrl = s => /^https?:\/\//i.test(String(s || "").trim());
  function linksOf(it) {
    const list = Array.isArray(it.links) ? it.links.slice() : [];
    if (isUrl(it.shop) && !list.includes(it.shop.trim())) list.unshift(it.shop.trim());
    return list.filter(isUrl);
  }
  function linkLabel(u) {
    try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return "リンク"; }
  }
  let rowArmed = null, rowArmTimer;
  const normText = t => String(t || "").normalize("NFKC").toLowerCase().replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const fullName = it => it.variant ? `${it.name}（${it.variant}）` : String(it.name || "");
  function toDateInput(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function lastOrderedText(it) {
    if (!it.lastOrderedAt) return "発注履歴なし";
    const d = new Date(it.lastOrderedAt), now = new Date();
    const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const days = Math.round((b - a) / 86400000);
    const ds = (d.getFullYear() === now.getFullYear() ? "" : d.getFullYear() + "/") + `${d.getMonth() + 1}/${d.getDate()}`;
    const rel = days <= 0 ? "今日" : days === 1 ? "昨日" : `${days}日前`;
    return `最終発注 ${ds}（${rel}）`;
  }
  function delBtn(it) {
    if (!canWrite) return "";
    const armed = rowArmed === it.id;
    return `<button class="btn danger sm del" data-act="delete" data-id="${esc(it.id)}" aria-label="${esc(fullName(it))}を削除">${armed ? "もう一度押すと削除" : "削除"}</button>`;
  }
  function linksHtml(it) {
    const ls = linksOf(it);
    if (!ls.length) return "";
    return `<div class="links">${ls.map(u => `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">🔗 ${esc(linkLabel(u))}</a>`).join("")}</div>`;
  }

  function stockOf(it) {
    if (pending.has(it.id)) return pending.get(it.id);
    return (typeof it.stock === "number") ? it.stock : null;
  }
  const isFlag = () => false;
  function needsOrder(it) {
    if (it.ordered) return false;
    if (isFlag(it)) return !!it.low;
    const s = stockOf(it);
    return s !== null && s < (it.min ?? 0);
  }
  function sorted(list) {
    const order = Object.fromEntries(CATS.map((c, i) => [c.id, i]));
    return list.slice().sort((a, b) => ((order[a.cat] ?? 99) - (order[b.cat] ?? 99)) || String(a.name).localeCompare(String(b.name), "ja") || String(a.variant || "").localeCompare(String(b.variant || ""), "ja"));
  }

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function notice(msg) {
    const n = $("#notice");
    if (!msg) { n.hidden = true; return; }
    n.textContent = msg; n.hidden = false;
  }
  function onWriteError(e) {
    if (e && e.code === "permission-denied") {
      canWrite = false;
      notice("このアカウントでは在庫を変更できません。会社のGoogleアカウントでログインし直してください。");
      render(); return;
    }
    if (e && e.code === "invalid_argument" && !canWrite) return;
    if (e && e.code === "invalid_argument") {
      canWrite = false;
      notice("この画面では在庫を変更できません（閲覧のみ）。変更するには、共有設定で編集できる権限をもらってください。");
      render(); return;
    }
    if (e && e.code === "quota_exceeded") { toast("保存できる上限に達しました。使わない品目を削除してください"); return; }
    toast("保存できませんでした。通信状況を確認してもう一度試してください");
  }

  // ---------- writes ----------
  function queueWrite(id, fn) {
    const prev = chains.get(id) || Promise.resolve();
    const next = prev.then(fn).catch(onWriteError);
    chains.set(id, next);
    return next;
  }
  function changeStock(id, delta) {
    const it = items.get(id); if (!it || !col || !canWrite) return;
    const cur = stockOf(it);
    const v = Math.max(0, (cur ?? 0) + delta);
    pending.set(id, v);
    render();
    clearTimeout(timers.get(id));
    timers.set(id, setTimeout(() => {
      const val = pending.get(id);
      queueWrite(id, async () => {
        await col.doc(id).update({ stock: val, updatedAt: Date.now() });
        if (pending.get(id) === val) pending.delete(id);
      });
    }, 700));
  }
  async function patch(id, data, msg) {
    if (!col || !canWrite) return;
    await queueWrite(id, async () => {
      await col.doc(id).update({ ...data, updatedAt: Date.now() });
      if (msg) toast(msg);
    });
  }

  // ---------- render ----------
  function render() {
    const all = [...items.values()];
    const need = sorted(all.filter(needsOrder));
    const waiting = sorted(all.filter(it => it.ordered));
    const badge = $("#badge");
    badge.textContent = need.length; badge.hidden = need.length === 0;

    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
    document.querySelector(".tabs").hidden = !signedIn;
    $("#seed").innerHTML = signedIn && loaded && items.size === 0 && SEED.length && canWrite
      ? `<div class="notice">まだ備品が登録されていません。claude.ai版のリストに入っていた備品（${SEED.length}件）を取り込めます。<div style="margin-top:10px"><button class="btn primary sm" data-act="import">備品データを取り込む</button></div></div>` : "";
    if (!signedIn) {
      ["order", "stock", "item", "qr", "help"].forEach(v => { $("#v-" + v).hidden = true; });
      $("#v-login").hidden = false; $("#fab").hidden = true;
      renderLogin(); return;
    }
    $("#v-login").hidden = true;
    ["order", "stock", "item", "qr", "help"].forEach(v => { $("#v-" + v).hidden = view !== v; });
    $("#fab").hidden = !canWrite || !col || view === "item" || view === "qr" || view === "help";

    if (view === "order") renderOrder(need, waiting);
    else if (view === "stock") renderStock(all);
    else if (view === "item") renderItem();
    else if (view === "help") renderHelp();
    else renderQR(all);
  }

  function orderRow(it, mode) {
    const s = stockOf(it);
    const unit = esc(it.unit || "");
    const shop = it.shop && !isUrl(it.shop) ? `<span>購入先：${esc(it.shop)}</span>` : "";
    const btns = mode === "need"
      ? `<button class="btn sm" data-act="ordered" data-id="${esc(it.id)}" ${canWrite ? "" : "disabled"}>発注した</button>`
      : `<button class="btn sm" data-act="arrived" data-id="${esc(it.id)}" ${canWrite ? "" : "disabled"}>${isFlag(it) ? "届いた" : `届いた（在庫＋${esc(it.qty)}）`}</button>
         <button class="btn ghost sm" data-act="unorder" data-id="${esc(it.id)}" ${canWrite ? "" : "disabled"}>発注を取り消す</button>`;
    return `<li class="order-row" style="--cat:${catOf(it.cat).color}">
      <div class="nm">${esc(fullName(it))}</div>
      <div class="qty">${esc(it.qty)}<small>${unit}</small></div>
      <div class="meta"><span>${isFlag(it) ? "少なくなったと報告あり" : `在庫 ${s ?? "?"}${unit}／最低 ${esc(it.min)}${unit}`}</span><span>${lastOrderedText(it)}</span>${shop}</div>
      ${linksHtml(it)}
      <div class="row-actions">${btns}</div>
    </li>`;
  }

  function renderOrder(need, waiting) {
    const el = $("#v-order");
    if (!loaded) { el.innerHTML = `<div class="empty">読み込み中…</div>`; return; }
    const n = need.length;
    el.innerHTML = `
      <div class="hero">
        <div class="hero-num ${n ? "" : "zero"}">${n}</div>
        <div class="hero-txt"><strong>${n ? "品目の発注が必要です" : "いま発注が必要なものはありません"}</strong>
        <span>在庫が最低在庫を下回った品目が自動で並びます</span></div>
        <img class="hero-ill ${n ? "" : "woman"}" src="${n ? IMG.robo : IMG.woman}" alt="">
      </div>
      ${n ? `<div class="actions"><button class="btn primary wide" data-act="copy">📋 発注メモをコピー</button></div>` : ""}
      ${n ? `<ul class="list">${need.map(it => orderRow(it, "need")).join("")}</ul>`
          : `<div class="empty">在庫が減ってきたら「在庫」タブで数を減らしてください。最低在庫を下回ると、ここに表示されます。</div>`}
      <h2 class="sec">発注済み・到着待ち <span class="count">${waiting.length}件</span></h2>
      ${waiting.length ? `<ul class="list">${waiting.map(it => orderRow(it, "wait")).join("")}</ul>`
                       : `<div class="empty">発注済みの品目はありません。</div>`}
    `;
  }

  function renderStock(all) {
    const el = $("#v-stock");
    if (!loaded) { el.innerHTML = `<div class="empty">読み込み中…</div>`; return; }
    const q = normText(query.trim());
    const shown = sorted(all.filter(it => (catFilter === "all" || it.cat === catFilter) && (!q || normText(fullName(it)).includes(q) || normText(it.note || "").includes(q))));
    const unknown = all.filter(it => !isFlag(it) && stockOf(it) === null).length;
    const chips = [`<button class="chip" data-cat="all" aria-pressed="${catFilter === "all"}">すべて</button>`]
      .concat(CATS.map(c => `<button class="chip" data-cat="${c.id}" aria-pressed="${catFilter === c.id}" style="--cat:${c.color}"><span class="dot"></span>${esc(c.label)}</button>`)).join("");

    let body = "";
    if (!all.length) {
      body = `<div class="empty"><img class="empty-ill" src="${IMG.woman}" alt="">まだ品目がありません。右上の「備品を登録」から登録してください。</div>`;
    } else if (!shown.length) {
      body = `<div class="empty">条件に合う品目がありません。</div>`;
    } else {
      let lastCat = null;
      body = shown.map(it => {
        let head = "";
        if (it.cat !== lastCat) {
          const c = catOf(it.cat); lastCat = it.cat;
          head = `<h2 class="cat-h" style="--cat:${c.color}"><span class="dot"></span>${esc(c.label)}</h2>`;
        }
        const s = stockOf(it), min = it.min ?? 0, unit = esc(it.unit || "");
        const nameBtn = `<button class="nm" data-edit="${esc(it.id)}">${esc(it.name)}${it.variant ? `<span class="var">${esc(it.variant)}</span>` : ""}</button>`;
        if (isFlag(it)) {
          const ftag = it.ordered ? `<span class="tag wait">発注済み</span>` : it.low ? `<span class="tag need">要発注</span>` : "";
          return `${head}<div class="item">
          <div>${nameBtn}${ftag}
          <div class="sub">少なくなったら報告・発注 ${esc(it.qty)}${unit}${it.note ? `・${esc(it.note)}` : ""}</div><div class="sub">${lastOrderedText(it)}</div>${linksHtml(it)}</div>
          <button class="lowbtn ${it.low || it.ordered ? "on" : ""}" data-act="low" data-id="${esc(it.id)}" ${canWrite && !it.ordered ? "" : "disabled"}>${it.ordered ? "発注済み" : it.low ? "報告済み ✓" : "少なくなった"}</button>
        </div>`;
        }
        const ratio = s === null ? 0 : Math.min(1, s / Math.max(1, min * 2));
        const gcls = s === null ? "" : s === 0 ? "out" : s < min ? "low" : "";
        const tag = s === null ? `<span class="tag unk">在庫未確認</span>` : it.ordered ? `<span class="tag wait">発注済み</span>` : s < min ? `<span class="tag need">要発注</span>` : "";
        return `${head}<div class="item" style="border-left:6px solid ${catOf(it.cat).color}">
          <div>${nameBtn}${tag}
          <div class="sub">最低 ${esc(min)}${unit}</div></div>
          <div class="stepper">${s === null
            ? `<button class="val unk" data-edit="${esc(it.id)}" data-focus="stock" aria-label="${esc(fullName(it))}の在庫数を入力">数を入力</button>`
            : `<button class="pm" data-step="-1" data-id="${esc(it.id)}" aria-label="${esc(fullName(it))}を1減らす" ${canWrite ? "" : "disabled"}>−</button>
            <button class="val" data-edit="${esc(it.id)}" data-focus="stock" aria-label="${esc(fullName(it))}の在庫数を入力">${s}</button>
            <button class="pm" data-step="1" data-id="${esc(it.id)}" aria-label="${esc(fullName(it))}を1増やす" ${canWrite ? "" : "disabled"}>＋</button>`}
          </div>
        </div>`;
      }).join("");
    }
    if (!el.querySelector("#search")) {
      el.innerHTML = `
      <div class="stock-notice"></div>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="品名で探す（ひらがな・カタカナどちらでもOK）" value="${esc(query)}" aria-label="品名で探す" autocomplete="off">
        <div class="chips"></div>
        <div><button class="btn sm" data-act="qr">QRコードを印刷する</button></div>
      </div>
      <div class="list"></div>`;
    }
    el.querySelector(".stock-notice").innerHTML = unknown ? `<div class="notice">在庫数が未確認の品目が${unknown}件あります。数を数えて「数を入力」から登録すると、発注リストの判定に使われます。</div>` : "";
    el.querySelector(".chips").innerHTML = chips;
    el.querySelector(".list").innerHTML = body;
  }

  // ---------- single item (QR) ----------
  let itemId = null;
  function renderItem() {
    const el = $("#v-item");
    if (!loaded) { el.innerHTML = `<div class="empty">読み込み中…</div>`; return; }
    const it = items.get(itemId);
    if (!it) {
      el.innerHTML = `<div class="empty">この備品は見つかりませんでした。削除された可能性があります。</div>
        <p style="text-align:center"><button class="btn" data-go="stock">在庫一覧を見る</button></p>`;
      return;
    }
    const c = catOf(it.cat), unit = esc(it.unit || ""), s = stockOf(it);
    let status, ctrl;
    if (isFlag(it)) {
      status = it.ordered ? "発注済みです。届くまでお待ちください" : it.low ? "少なくなったと報告済みです" : "まだ十分にあります";
      ctrl = it.ordered ? "" : it.low
        ? `<button class="big done" data-act="low" data-id="${esc(it.id)}" ${canWrite ? "" : "disabled"}>報告を取り消す</button>`
        : `<button class="big" data-act="low" data-id="${esc(it.id)}" ${canWrite ? "" : "disabled"}>少なくなった</button>`;
    } else {
      status = s === null ? "在庫数がまだ登録されていません" : it.ordered ? "発注済みです" : s < (it.min ?? 0) ? "発注リストに載っています" : `最低在庫は${esc(it.min)}${unit}です`;
      ctrl = s === null
        ? `<button class="big input" data-edit="${esc(it.id)}" data-focus="stock" ${canWrite ? "" : "disabled"}>数を入力</button>`
        : `<div class="bigstep">
          <button data-step="-1" data-id="${esc(it.id)}" aria-label="1減らす" ${canWrite ? "" : "disabled"}>−</button>
          <div class="n">${s ?? "?"}<small style="font-size:1rem;font-family:inherit">${unit}</small></div>
          <button data-step="1" data-id="${esc(it.id)}" aria-label="1増やす" ${canWrite ? "" : "disabled"}>＋</button>
        </div>`;
    }
    el.innerHTML = `<div class="solo" style="--cat:${c.color}">
        <img class="solo-ill" src="${IMG.robo}" alt="">
        <div class="cat">${esc(c.label)}</div>
        <h2>${esc(fullName(it))}</h2>
        <div class="status">${status}</div>
        ${ctrl}
        ${linksHtml(it)}
        <div class="sub" style="color:var(--ink-2);font-size:.85rem">${lastOrderedText(it)}</div>
      </div>
      <p style="text-align:center;margin-top:20px"><button class="btn ghost" data-go="stock">在庫一覧を見る</button> <button class="btn ghost" data-go="order">発注リストを見る</button></p>`;
  }

  // ---------- QR sheet ----------
  const BASE_URL = location.origin + location.pathname;
  function qrSvg(text) {
    if (typeof window.qrcode !== "function") return "";
    try { const q = window.qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag(4, 2); } catch { return ""; }
  }
  function qrLabels(list) {
    return list.map(it => {
      const c = catOf(it.cat);
      return `<div class="qr-label" style="--cat:${c.color}">${qrSvg(BASE_URL + "#q-" + it.id)}
        <div class="n">${esc(fullName(it))}</div>
        <div class="s">使ったら読み取って数を減らす</div></div>`;
    }).join("");
  }
  function qrList(all) { return sorted(all.filter(it => catFilter === "all" || it.cat === catFilter)); }
  function renderQR(all) {
    const el = $("#v-qr");
    if (!loaded) { el.innerHTML = `<div class="empty">読み込み中…</div>`; return; }
    const list = qrList(all);
    const chips = [`<button class="chip" data-cat="all" aria-pressed="${catFilter === "all"}">すべて</button>`]
      .concat(CATS.map(c => `<button class="chip" data-cat="${c.id}" aria-pressed="${catFilter === c.id}" style="--cat:${c.color}"><span class="dot"></span>${esc(c.label)}</button>`)).join("");
    const libOk = typeof window.qrcode === "function";
    el.innerHTML = `<div class="no-print">
        <p style="margin:0 0 6px"><button class="btn ghost sm" data-go="stock">← 在庫に戻る</button></p>
        <h2 class="sec" style="margin-top:12px">棚に貼るQRコード <span class="count">${list.length}件</span></h2>
        <p style="color:var(--ink-2);font-size:.9rem;margin:0 0 12px">印刷して、それぞれの備品の棚や箱に貼ってください。スマホで読み取ると、その備品の画面が開いてすぐ報告できます。</p>
        <div class="chips" style="margin-bottom:12px">${chips}</div>
        <div class="actions"><button class="btn primary" data-act="print">印刷する</button><button class="btn" data-act="saveqr">ファイルで保存</button></div>
        <p style="color:var(--ink-2);font-size:.8rem;margin:-10px 0 16px">「印刷する」で印刷画面が開かない場合は、「ファイルで保存」したファイルをブラウザで開いて印刷してください。</p>
      </div>
      ${libOk ? (list.length ? `<div class="qr-grid">${qrLabels(list)}</div>` : `<div class="empty">備品がありません。</div>`)
              : `<div class="empty">QRコードを作れませんでした。ページを開き直してください。</div>`}`;
  }
  async function saveQR() {
    const list = qrList([...items.values()]);
    const css = `body{font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;margin:16px;color:#111}
      h1{font-size:16px}.qr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
      .qr-label{border:1.5px dashed #999;border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border-top:6px solid #888;break-inside:avoid}
      .qr-label svg{width:120px;height:120px}.n{font-weight:700;font-size:14px}.s{font-size:11px;color:#555}
      @media print{h1{display:none}}`;
    const colors = { fab: "#7b5cd6", craft: "#e8743b", elec: "#2f8fd8", daily: "#2aa676", gear: "#8a6a4a" };
    const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>PITAAAN！備品QRコード</title><style>${css}</style></head><body>
      <h1>PITAAAN！備品QRコード（印刷して切り取ってください）</h1><div class="qr-grid">${qrLabels(list).replace(/--cat:var\(--c-(\w+)\)/g, (m, k) => "border-top-color:" + (colors[k] || "#888"))}</div></body></html>`;
    try {
      const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      const a = document.createElement("a"); a.href = url; a.download = "pitaaan-qr-codes.html";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch { toast("保存できませんでした"); }
  }

  // ---------- help ----------
  function renderHelp() {
    const ink = "var(--ink)", sig = "var(--signal)", sur = "var(--surface)", sur2 = "var(--surface-2)", line = "var(--line)";
    const qrMini = (x, y, s) => {
      const c = s / 7, cells = [[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2],[4,0],[5,0],[6,0],[4,1],[6,1],[4,2],[5,2],[6,2],[0,4],[1,4],[2,4],[0,5],[2,5],[0,6],[1,6],[2,6],[4,4],[6,4],[5,5],[4,6],[6,6],[3,3],[5,3],[3,5]];
      return `<rect x="${x - 2}" y="${y - 2}" width="${s + 4}" height="${s + 4}" fill="#fff" rx="2"/>` + cells.map(([a, b]) => `<rect x="${x + a * c}" y="${y + b * c}" width="${c}" height="${c}" fill="#14263a"/>`).join("");
    };
    const cloud = (x, y, k) => `<g transform="translate(${x} ${y}) scale(${k})" fill="${sur}" stroke="${line}" stroke-width="2"><path d="M10 40 a18 18 0 0 1 8-33 a24 24 0 0 1 44 4 a16 16 0 0 1 18 29 z"/></g>`;
    const phone = (x, y, inner) => `<g transform="translate(${x} ${y})"><rect width="70" height="120" rx="12" fill="${ink}"/><rect x="5" y="12" width="60" height="96" rx="4" fill="${sur}"/><rect x="27" y="5" width="16" height="3" rx="1.5" fill="${sur2}"/>${inner}</g>`;

  // ---------- login ----------
  function renderLogin() {
    const ready = !!auth;
    $("#v-login").innerHTML = `<div class="login">
      <img src="${IMG.robo}" alt="">
      <h2>備品・発注リスト</h2>
      <p>PITAAAN！のスタッフ用です。${DOMAIN ? `会社のGoogleアカウント（@${esc(DOMAIN)}）で` : "会社のGoogleアカウントで"}ログインしてください。</p>
      ${loginError ? `<p class="err">${esc(loginError)}</p>` : ""}
      <button class="btn primary wide" data-act="login" ${ready ? "" : "disabled"}>Googleでログイン</button>
    </div>`;
  }
  async function doLogin() {
    if (!auth) return;
    loginError = ""; render();
    const provider = new firebase.auth.GoogleAuthProvider();
    if (DOMAIN) provider.setCustomParameters({ hd: DOMAIN, prompt: "select_account" });
    else provider.setCustomParameters({ prompt: "select_account" });
    try { await auth.signInWithPopup(provider); }
    catch (e) {
      if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) {
        try { await auth.signInWithRedirect(provider); return; } catch {}
      }
      if (e && e.code === "auth/popup-closed-by-user") return;
      loginError = "ログインできませんでした。もう一度お試しください。"; render();
    }
  }
  async function importSeed() {
    if (!col || !SEED.length) return;
    try {
      const fs = firebase.firestore(); const batch = fs.batch();
      SEED.forEach(({ id, ...rest }) => {
        const data = {}; Object.entries(rest).forEach(([k, v]) => { if (v !== undefined) data[k] = v; });
        data.updatedAt = Date.now();
        batch.set(col.doc(String(id)), data);
      });
      await batch.commit();
      toast(`${SEED.length}件の備品を取り込みました`);
    } catch (e) { onWriteError(e); }
  }

  // ---------- copy ----------
  function orderText() {
    const need = sorted([...items.values()].filter(needsOrder));
    let out = "以下PITAAANにお願いします！\n時間指定　火曜日から土曜日 10:00-19:00\n";
    need.forEach(it => {
      out += `\n${fullName(it)} × ${it.qty}${it.unit || ""}\n`;
      linksOf(it).forEach(u => { out += `${u}\n`; });
    });
    return out;
  }
  async function copyOrder() {
    const text = orderText();
    try { await navigator.clipboard.writeText(text); toast("発注メモをコピーしました"); }
    catch { $("#copytext").value = text; $("#copydlg").showModal(); $("#copytext").select(); }
  }

  // ---------- dialog ----------
  $("#f-cat").innerHTML = CATS.map(c => `<option value="${c.id}">${esc(c.label)}</option>`).join("");
  function openForm(id, focusStock) {
    editingId = id || null;
    const it = id ? items.get(id) : null;
    $("#dlg-title").textContent = it ? "備品を編集" : "備品を登録";
    $("#f-save").textContent = it ? "保存" : "登録";
    $("#f-last").value = it?.lastOrderedAt ? toDateInput(it.lastOrderedAt) : "";
    $("#f-name").value = it?.name || "";
    $("#f-var").value = it?.variant || "";
    $("#f-cat").value = it?.cat || (catFilter !== "all" ? catFilter : CATS[0].id);
    $("#f-unit").value = it?.unit || "";
    const s = it ? stockOf(it) : null;
    $("#f-stock").value = s ?? "";
    $("#f-min").value = it?.min ?? 2;
    $("#f-qty").value = it?.qty ?? 5;
    $("#f-shop").value = it && !isUrl(it.shop) ? (it.shop || "") : "";
    $("#f-links").value = it ? linksOf(it).join("\n") : "";
    $("#f-note").value = it?.note || "";
    $("#f-err").textContent = "";
    $("#f-del").hidden = !it || !canWrite;
    $("#f-dup").hidden = !it || !canWrite;
    $("#f-save").disabled = !canWrite || !col;
    $("#form").querySelectorAll("input,select,textarea").forEach(i => i.disabled = !canWrite || !col);
    $("#dlg").showModal();
    (focusStock ? $("#f-stock") : $("#f-name")).focus();
  }
  $("#f-cancel").onclick = () => $("#dlg").close();
  $("#copyclose").onclick = () => $("#copydlg").close();
  $("#form").addEventListener("submit", async ev => {
    ev.preventDefault();
    if (!col || !canWrite) return;
    const name = $("#f-name").value.trim();
    const min = parseInt($("#f-min").value, 10);
    const qty = parseInt($("#f-qty").value, 10);
    const stockRaw = $("#f-stock").value.trim();
    const stock = stockRaw === "" ? null : Math.max(0, parseInt(stockRaw, 10));
    if (!name) { $("#f-err").textContent = "品名を入力してください"; return; }
    const mode = "count";
    const prevMin = editingId ? items.get(editingId)?.min : 0;
    if ((mode === "count" && !(min >= 0)) || !(qty >= 1)) { $("#f-err").textContent = "最低在庫は0以上、発注数は1以上で入力してください"; return; }
    const shopRaw = $("#f-shop").value.trim();
    const lines = $("#f-links").value.split(/\s*\n\s*/).map(s => s.trim()).filter(Boolean);
    if (isUrl(shopRaw)) lines.unshift(shopRaw);
    const bad = lines.filter(s => !isUrl(s));
    if (bad.length) { $("#f-err").textContent = "商品リンクは https:// から始まるURLを1行に1つずつ入力してください"; return; }
    const links = [...new Set(lines)].slice(0, 10);
    const data = { name, variant: $("#f-var").value.trim(), mode, cat: $("#f-cat").value, unit: $("#f-unit").value.trim(), stock: Number.isNaN(stock) ? null : stock, min: Number.isNaN(min) ? (prevMin ?? 0) : min, qty,
      shop: isUrl(shopRaw) ? "" : shopRaw, links, note: $("#f-note").value.trim(), updatedAt: Date.now() };
    const lastVal = $("#f-last").value;
    const prevIt = editingId ? items.get(editingId) : null;
    if (!lastVal) data.lastOrderedAt = null;
    else if (prevIt?.lastOrderedAt && toDateInput(prevIt.lastOrderedAt) === lastVal) data.lastOrderedAt = prevIt.lastOrderedAt;
    else data.lastOrderedAt = new Date(lastVal + "T12:00:00").getTime();
    $("#f-save").disabled = true;
    try {
      if (editingId) {
        const id = editingId;
        clearTimeout(timers.get(id)); pending.delete(id);
        await queueWrite(id, () => col.doc(id).update(data));
        toast("保存しました");
      } else {
        const id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        await col.doc(id).set({ ...data, ordered: false });
        toast("登録しました");
      }
      $("#dlg").close();
    } catch (e) { onWriteError(e); }
    finally { $("#f-save").disabled = false; }
  });
  $("#f-dup").onclick = () => {
    editingId = null;
    $("#dlg-title").textContent = "色違いを登録";
    $("#f-save").textContent = "登録";
    ["#f-var", "#f-links", "#f-stock", "#f-note", "#f-last"].forEach(s => $(s).value = "");
    $("#f-del").hidden = true; $("#f-dup").hidden = true; $("#f-err").textContent = "";
    $("#f-var").focus();
  };
  $("#f-del").onclick = async () => {
    if (!editingId || !col) return;
    const it = items.get(editingId);
    if (!confirmDelete(it)) return;
    const id = editingId;
    try { await queueWrite(id, () => col.doc(id).delete()); toast("削除しました"); $("#dlg").close(); }
    catch (e) { onWriteError(e); }
  };
  let delArmed = null;
  function confirmDelete(it) {
    // two-tap confirm (confirm() may be blocked inside the viewer)
    if (delArmed === it?.id) { delArmed = null; $("#f-del").textContent = "削除"; return true; }
    delArmed = it?.id; $("#f-del").textContent = "もう一度押すと削除";
    setTimeout(() => { if (delArmed === it?.id) { delArmed = null; $("#f-del").textContent = "削除"; } }, 3000);
    return false;
  }

  document.addEventListener("click", e => {

    if (step) { changeStock(step.dataset.id, parseInt(step.dataset.step, 10)); return; }
    const ed = e.target.closest("[data-edit]");
    if (ed) { openForm(ed.dataset.edit, ed.dataset.focus === "stock"); return; }
    const go = e.target.closest("[data-go]");
    if (go) { view = go.dataset.go; history.replaceState(null, "", "#" + view); render(); window.scrollTo(0, 0); return; }
    const chip = e.target.closest("[data-cat]");
    if (chip) { catFilter = chip.dataset.cat; render(); return; }
    const act = e.target.closest("[data-act]");
    if (!act) return;
    const id = act.dataset.id, it = id && items.get(id);
    if (act.dataset.act === "delete" && it) {
      clearTimeout(rowArmTimer);
      if (rowArmed !== id) {
        rowArmed = id; render();
        rowArmTimer = setTimeout(() => { rowArmed = null; render(); }, 3000);
        return;
      }
      rowArmed = null;
      clearTimeout(timers.get(id)); pending.delete(id);
      queueWrite(id, () => col.doc(id).delete()).then(() => toast(`「${fullName(it)}」を削除しました`));
      return;
    }
    if (act.dataset.act === "login") { doLogin(); return; }
    if (act.dataset.act === "logout") { auth && auth.signOut(); return; }
    if (act.dataset.act === "import") { act.disabled = true; importSeed(); return; }
    if (act.dataset.act === "copy") copyOrder();
    if (act.dataset.act === "qr") { view = "qr"; history.replaceState(null, "", "#qr"); render(); window.scrollTo(0, 0); return; }
    if (act.dataset.act === "print") { try { window.print(); } catch { toast("印刷画面を開けませんでした。「ファイルで保存」を使ってください"); } return; }
    if (act.dataset.act === "saveqr") { saveQR(); return; }
    if (act.dataset.act === "low" && it) {
      patch(id, { low: !it.low }, it.low ? "報告を取り消しました" : `「${fullName(it)}」を発注リストに入れました`);
      return;
    }
    if (act.dataset.act === "almost" && it) {
      clearTimeout(timers.get(id)); pending.delete(id);
      patch(id, { stock: it.min ?? 0 }, `「${fullName(it)}」を発注リストに入れました`);
      return;
    }
    if (act.dataset.act === "ordered" && it) patch(id, { ordered: true, orderedAt: Date.now(), lastOrderedAt: Date.now(), prevOrderedAt: it.lastOrderedAt ?? null }, `「${fullName(it)}」を発注済みにしました`);
    if (act.dataset.act === "unorder" && it) patch(id, { ordered: false, lastOrderedAt: it.prevOrderedAt ?? null }, "発注を取り消しました");
    if (act.dataset.act === "arrived" && it) {
      clearTimeout(timers.get(id));
      const base = stockOf(it) ?? 0; pending.delete(id);
      if (isFlag(it)) { patch(id, { ordered: false, low: false }, `「${fullName(it)}」の到着を記録しました`); return; }
      patch(id, { ordered: false, stock: base + (it.qty || 0) }, `「${fullName(it)}」の在庫に${it.qty}${it.unit || ""}追加しました`);
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "search") {
      query = e.target.value;
      if (e.isComposing) return;
      render();
    }
  });
  document.addEventListener("compositionend", e => {
    if (e.target.id === "search") { query = e.target.value; render(); }
  });
  $("#fab").onclick = () => openForm(null);

  function readHash() {
    const h = (location.hash || "").slice(1);
    if (h === "stock" || h === "order" || h === "qr" || h === "help") view = h;
    else if (h.startsWith("q-")) { view = "item"; itemId = h.slice(2); }
  }
  readHash();
  window.addEventListener("hashchange", () => { readHash(); render(); });

  render();

  // ---------- data (Firebase) ----------
  (() => {
    if (!window.firebase || !CFG.firebase || !CFG.firebase.apiKey) {
      loginError = "設定ファイル（config.js）にFirebaseの情報がまだ入っていません。手順書を見て設定してください。";
      render(); return;
    }
    firebase.initializeApp(CFG.firebase);
    auth = firebase.auth();
    const fs = firebase.firestore();
    auth.onAuthStateChanged(async u => {
      if (unsub) { unsub(); unsub = null; }
      user = u;
      if (!u) { signedIn = false; col = null; items = new Map(); loaded = false; render(); return; }
      if (DOMAIN && !String(u.email || "").toLowerCase().endsWith("@" + DOMAIN)) {
        loginError = `@${DOMAIN} のアカウントでログインしてください（今は ${u.email}）`;
        await auth.signOut(); return;
      }
      signedIn = true; canWrite = true; loginError = ""; notice("");
      col = fs.collection("items");
      unsub = col.onSnapshot(snap => {
        items = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
        loaded = true;
        render();
      }, err => {
        loaded = true;
        if (err.code === "permission-denied") { canWrite = false; notice("このアカウントでは備品リストを見られません。会社のGoogleアカウントでログインし直してください。"); render(); return; }
        notice("データの読み込みが止まりました。ページを開き直してください。");
      });
    });
    render();
  })();
})();
</script>
</body>
</html>
